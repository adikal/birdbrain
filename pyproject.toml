[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "birdbrain-agent"
version = "0.1.0"
description = "Persistent autonomous embodied-agent research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
sim = [
  "mujoco==3.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/birdbrain"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
