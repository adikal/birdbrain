[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "birdbrain-agent"
version = "0.2.0"
description = "Persistent autonomous embodied-agent research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
cloud = [
  "boto3>=1.35",
  "certifi>=2024.0",
]

[project.scripts]
birdbrain-run = "birdbrain.run:main"
birdbrain-compare = "birdbrain.evaluation:main"
birdbrain-record = "birdbrain.record:main"
birdbrain-dashboard = "birdbrain.observability.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/birdbrain"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
